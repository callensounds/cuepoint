name = "cuepoint"
main = "src/worker.js"
compatibility_date = "2026-09-01"

# Static dashboard in public/; /api/* goes to the Worker first.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "cuepoint"
database_id = "062a4cf6-c9c6-4eeb-8461-3ae889aae848"

# :07 — refresh daily snapshots for searched artists (10 per run, skips ones already done today)
# :37 — chart crawl step (Apple Music + Deezer charts; each chart once per day)
[triggers]
crons = ["7 * * * *", "37 * * * *"]
